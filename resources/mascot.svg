<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The mascot: a penguin in a suit with a clipboard, keeping the distros in order.
       Source of images/mascot.png. The same drawing is in icon.svg. -->
  <g>
    <!-- feet -->
    <ellipse cx="100" cy="232" rx="24" ry="9" fill="#f5a623"/>
    <ellipse cx="156" cy="232" rx="24" ry="9" fill="#f5a623"/>
    <!-- body: the suit jacket over a penguin -->
    <ellipse cx="128" cy="150" rx="76" ry="86" fill="#141a24"/>
    <path d="M60 128 Q58 200 96 228 L160 228 Q198 200 196 128 L166 118 L128 196 L90 118 Z" fill="#2c3648"/>
    <!-- shirt, lapels, tie -->
    <path d="M94 118 L162 118 L128 196 Z" fill="#ffffff"/>
    <path d="M90 118 L128 196 L110 176 L80 130 Z" fill="#1b2230"/>
    <path d="M166 118 L128 196 L146 176 L176 130 Z" fill="#1b2230"/>
    <path d="M121 134 L135 134 L132 144 L124 144 Z" fill="#23a862"/>
    <path d="M124 144 L132 144 L138 176 L128 188 L118 176 Z" fill="#2fcf78"/>
    <!-- right flipper, in the sleeve -->
    <path d="M196 132 Q224 168 214 208 Q198 190 188 160 Z" fill="#2c3648"/>
    <!-- head -->
    <circle cx="128" cy="84" r="52" fill="#141a24"/>
    <ellipse cx="110" cy="94" rx="24" ry="28" fill="#ffffff"/>
    <ellipse cx="146" cy="94" rx="24" ry="28" fill="#ffffff"/>
    <ellipse cx="128" cy="110" rx="32" ry="18" fill="#ffffff"/>
    <circle cx="113" cy="90" r="7.5" fill="#141a24"/>
    <circle cx="143" cy="90" r="7.5" fill="#141a24"/>
    <circle cx="115.5" cy="87.5" r="2.5" fill="#ffffff"/>
    <circle cx="145.5" cy="87.5" r="2.5" fill="#ffffff"/>
    <path d="M113 106 Q128 99 143 106 Q128 122 113 106 Z" fill="#f5a623"/>
    <!-- left flipper, behind the clipboard it holds -->
    <path d="M66 136 Q30 162 30 204 Q42 202 50 186 Z" fill="#2c3648"/>
    <!-- clipboard with a checklist: two done, one to do -->
    <g transform="rotate(-8 72 180)">
      <rect x="38" y="136" width="68" height="88" rx="7" fill="#b9793d"/>
      <rect x="45" y="148" width="54" height="69" rx="3" fill="#ffffff"/>
      <rect x="59" y="129" width="26" height="13" rx="4" fill="#9aa6b8"/>
      <path d="M51 162 l4 4 l7 -8" fill="none" stroke="#23a862" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="67" y="160" width="26" height="4" rx="2" fill="#9aa6b8"/>
      <path d="M51 182 l4 4 l7 -8" fill="none" stroke="#23a862" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="67" y="180" width="22" height="4" rx="2" fill="#9aa6b8"/>
      <rect x="51" y="198" width="10" height="10" rx="2" fill="none" stroke="#9aa6b8" stroke-width="2.5"/>
      <rect x="67" y="201" width="24" height="4" rx="2" fill="#9aa6b8"/>
    </g>
  </g>
</svg>
