  <circle cx="36" cy="64" r="5" fill="#2fcf78"/>
  <circle cx="36" cy="91" r="5" fill="#7f93aa"/>
  <rect x="48" y="34.5" width="44" height="5" rx="2.5" fill="#1a4f8f"/>
