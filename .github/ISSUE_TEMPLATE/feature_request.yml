name: Feature request
description: Suggest something the extension should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How the extension could help. Mention any privileges it would need (sudo, administrator).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do instead today, such as a `wsl.exe` command.
