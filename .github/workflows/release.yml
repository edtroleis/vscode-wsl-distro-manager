name: Release

# Every merge to main: test, then publish the version in package.json to the
# Marketplace, tag it, and create a GitHub release. A version that is already
# published is skipped, so re-runs and docs-only pushes are harmless.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; the publish job asks for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
      # Only for signing in to Azure with OIDC (Entra ID); no secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: status
        run: bash scripts/marketplace-status.sh

      - name: Already published
        if: steps.status.outputs.published == 'true'
        run: echo "::notice::Version ${{ steps.status.outputs.version }} is already on the Marketplace; nothing to publish."

      - name: Package
        if: steps.status.outputs.published == 'false'
        run: npx vsce package --out "vscode-wsl-distro-manager-${{ steps.status.outputs.version }}.vsix"

      # Two ways to authenticate, see CONTRIBUTING.md > Releases:
      # - Microsoft Entra ID (recommended): the variables AZURE_CLIENT_ID and
      #   AZURE_TENANT_ID of a managed identity that is a member of the
      #   publisher. Short-lived credentials, nothing stored.
      # - An organization-scoped Azure DevOps token in the secret VSCE_PAT.
      #   Global tokens stop working on 2026-12-01.
      - name: Sign in to Azure (Entra ID)
        if: steps.status.outputs.published == 'false' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity needs no role in any subscription, only publisher membership.
          allow-no-subscriptions: true

      # The ID to add as a member of the publisher (Contributor). It exists only
      # for the identity itself, so this is where to read it during setup.
      - name: Marketplace member ID
        if: steps.status.outputs.published == 'false' && vars.AZURE_CLIENT_ID != ''
        run: |
          id=$(az rest -u "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.3" \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "::notice title=Marketplace member ID::$id (a member of the publisher, role Contributor)"

      - name: Publish to the Marketplace
        if: steps.status.outputs.published == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          USE_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' }}
          VSIX: vscode-wsl-distro-manager-${{ steps.status.outputs.version }}.vsix
        run: |
          if [ "$USE_ENTRA" = "true" ]; then
            npx vsce publish --azure-credential --packagePath "$VSIX"
          elif [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath "$VSIX"
          else
            echo "::error::No Marketplace credentials. Set the AZURE_* variables (Entra ID) or the VSCE_PAT secret in the marketplace environment; see CONTRIBUTING.md."
            exit 1
          fi

      - name: Tag and create the GitHub release
        if: steps.status.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.status.outputs.version }}
        run: |
          # Release notes: the CHANGELOG section of this version.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "vscode-wsl-distro-manager-$VERSION.vsix" --clobber
          else
            gh release create "v$VERSION" "vscode-wsl-distro-manager-$VERSION.vsix" \
              --target "$GITHUB_SHA" --title "Distro Manager for WSL $VERSION" --notes-file notes.md
          fi
